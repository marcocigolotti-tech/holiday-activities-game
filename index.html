<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082d58"><title>Holiday Activities</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Verdana,sans-serif;background:linear-gradient(#78d4ff,#e9f8ff 55%,#f3d39a);color:#082d58;min-height:100vh}main{max-width:1100px;margin:auto;padding:10px}.hero{text-align:center}.hero h1{font-size:clamp(34px,6vw,62px);color:white;text-shadow:0 5px #082d58;margin:5px}.hero h1 b{color:#ffd02f}.panel{background:#fff;border:4px solid #082d58;border-radius:22px;box-shadow:0 9px #082d58,0 18px 30px #0002}.start,.end{text-align:center;padding:25px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:800px;margin:20px auto}.mode{border:4px solid #082d58;border-radius:20px;padding:22px;background:#eef8ff;color:#082d58;font:inherit;font-size:19px;font-weight:900;box-shadow:0 7px #082d58;cursor:pointer}.mode b{display:block;font-size:27px;margin:7px}.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#082d58;color:#fff;padding:11px 15px}.prog{height:17px;flex:1;min-width:130px;background:#71849a;border-radius:20px;overflow:hidden}.bar{height:100%;background:#3dd25a}.card{margin-top:17px;padding:17px}.question{text-align:center;font-size:clamp(24px,4vw,39px);font-weight:1000;margin:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}.visual img{width:100%;max-height:315px;object-fit:contain;border:4px solid #a7cde8;border-radius:18px}.answers{display:grid;gap:9px}.ans{display:flex;align-items:center;gap:10px;width:100%;padding:9px;border:3px solid #b7cee4;border-radius:14px;background:#fff;color:#082d58;font:inherit;font-size:clamp(17px,2.3vw,23px);font-weight:900;text-align:left;cursor:pointer}.letter{display:grid;place-items:center;min-width:45px;height:45px;border-radius:9px;background:#1588ef;color:#fff;font-size:25px}.ans:nth-child(2) .letter{background:#ef5261}.ans:nth-child(3) .letter{background:#2dbd65}.ans:nth-child(4) .letter{background:#e5a500}.audio{margin-left:auto;min-width:40px;height:40px;border:2px solid #082d58;border-radius:50%;background:#e6f5ff;cursor:pointer}.correct{background:#e7f9ed!important;border-color:#2dbd65!important}.wrong{background:#fff0f1!important;border-color:#ef5261!important}.feedback{display:none;margin-top:14px;padding:13px;border-radius:13px;background:#edf6fb;font-size:18px}.good{border-left:8px solid #2dbd65}.bad{border-left:8px solid #ef5261}.control{border:0;border-radius:12px;background:#1588ef;color:#fff;padding:10px 14px;font:inherit;font-weight:900;cursor:pointer}.next{display:none;margin:13px auto 0;background:#ffd02f;color:#082d58}.hidden{display:none!important}.imgchoices{grid-template-columns:1fr 1fr}.imgans img{width:100%;height:150px;object-fit:contain}.score{font-size:55px;font-weight:1000}.vocab{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chip{border:2px solid #082d58;border-radius:999px;padding:5px 9px;font-weight:800;background:white}@media(max-width:700px){.modes,.grid{grid-template-columns:1fr}.imgchoices{grid-template-columns:1fr 1fr}.imgans img{height:105px}.card{padding:10px}}</style></head><body><main>
<div class="hero"><h1>🏝️ HOLIDAY <b>ACTIVITIES</b></h1><p>English Vocabulary · Unit 3 · 15 activities</p></div>
<section id="start" class="panel start"><div style="font-size:68px">🎮 ✈️</div><h2>CHOOSE YOUR MISSION</h2><div class="modes"><button class="mode" onclick="startGame('look')">🖼️<b>LOOK & CHOOSE</b>Guarda l'immagine e scegli l'espressione.</button><button class="mode" onclick="startGame('listen')">🎧<b>LISTEN & CHOOSE</b>Ascolta l'espressione e scegli l'immagine.</button></div><div id="vocab" class="vocab"></div></section>
<section id="game" class="hidden"><div class="panel hud"><b>🎯 <span id="count"></span></b><div class="prog"><div id="bar" class="bar"></div></div><b>⭐ <span id="points">0</span></b><b>🔥 <span id="streak">0</span></b><button class="control" onclick="restart()">↻ Restart</button></div><div class="panel card"><div id="question" class="question"></div><div id="content"></div><div id="fb" class="feedback"></div><button id="next" class="control next" onclick="nextQ()">NEXT →</button></div></section>
<section id="end" class="panel end hidden"><div style="font-size:72px">🏆</div><h2>MISSION COMPLETE!</h2><div id="final" class="score"></div><p id="message"></p><button class="control" onclick="restart()">PLAY AGAIN</button> <button class="control" onclick="home()">CHANGE MODE</button></section>
</main><script>const DATA=[{"phrase": "go snorkelling", "image": "images/snorkelling.svg"}, {"phrase": "go horse riding", "image": "images/horse-riding.svg"}, {"phrase": "stay at a campsite", "image": "images/campsite.svg"}, {"phrase": "buy souvenirs", "image": "images/souvenirs.svg"}, {"phrase": "eat local food", "image": "images/local-food.svg"}, {"phrase": "go sailing", "image": "images/sailing.svg"}, {"phrase": "visit museums", "image": "images/museums.svg"}, {"phrase": "take photos", "image": "images/photos.svg"}, {"phrase": "go sightseeing", "image": "images/sightseeing.svg"}, {"phrase": "go skiing", "image": "images/skiing.svg"}, {"phrase": "sleep in a tent", "image": "images/tent.svg"}, {"phrase": "go windsurfing", "image": "images/windsurfing.svg"}, {"phrase": "go-karting", "image": "images/go-karting.svg"}, {"phrase": "go scuba diving", "image": "images/scuba-diving.svg"}, {"phrase": "go shopping", "image": "images/shopping.svg"}];let order=[],idx=0,score=0,streak=0,mode="look",locked=false;const $=x=>document.getElementById(x);
function sh(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function speak(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.8;speechSynthesis.speak(u)}
$("vocab").innerHTML=DATA.map(x=>`<span class="chip">${x.phrase} <button class="audio" style="min-width:28px;height:28px" onclick="speak('${x.phrase}')">🔊</button></span>`).join("");
function startGame(m){mode=m;order=sh(DATA);idx=0;score=0;streak=0;$("start").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");render()}
function restart(){startGame(mode)}function home(){$("game").classList.add("hidden");$("end").classList.add("hidden");$("start").classList.remove("hidden")}
function choices(x){return sh([x,...sh(DATA.filter(y=>y.phrase!==x.phrase)).slice(0,3)])}
function render(){locked=false;let x=order[idx],cs=choices(x);$("count").textContent=`${idx+1} / 15`;$("points").textContent=score*5;$("streak").textContent=streak;$("bar").style.width=`${idx/15*100}%`;$("fb").style.display="none";$("fb").className="feedback";$("next").style.display="none";
if(mode==="look"){$("question").innerHTML=`What is this holiday activity? <button class="audio" onclick="speak('What is this holiday activity?')">🔊</button>`;$("content").innerHTML=`<div class="grid"><div class="visual"><img src="${x.image}" alt=""></div><div id="answers" class="answers"></div></div>`;cs.forEach((c,k)=>{let b=document.createElement("button");b.className="ans";b.dataset.phrase=c.phrase;b.innerHTML=`<span class="letter">${"ABCD"[k]}</span><span>${c.phrase}</span><span class="audio">🔊</span>`;b.querySelector(".audio").onclick=e=>{e.stopPropagation();speak(c.phrase)};b.onclick=()=>pick(b,c,x);$("answers").appendChild(b)})}
else{$("question").innerHTML=`Listen and choose the correct picture. <button class="audio" onclick="speak('${x.phrase}')">🔊</button>`;$("content").innerHTML=`<div id="answers" class="answers imgchoices"></div>`;cs.forEach((c,k)=>{let b=document.createElement("button");b.className="ans imgans";b.dataset.phrase=c.phrase;b.innerHTML=`<span class="letter">${"ABCD"[k]}</span><img src="${c.image}" alt="">`;b.onclick=()=>pick(b,c,x);$("answers").appendChild(b)});setTimeout(()=>speak(x.phrase),250)}}
function pick(btn,c,x){if(locked)return;locked=true;let bs=[...$("answers").children];bs.forEach(b=>{b.disabled=true;if(b.dataset.phrase===x.phrase)b.classList.add("correct")});let ok=c.phrase===x.phrase;if(ok){score++;streak++}else{streak=0;btn.classList.add("wrong")}let f=$("fb");f.classList.add(ok?"good":"bad");f.innerHTML=(ok?`<b>⭐ CORRECT!</b>`:`<b>TRY AGAIN NEXT TIME!</b><br>Correct:`)+` <b>${x.phrase}</b> <button class="audio" onclick="speak('${x.phrase}')">🔊</button>`;f.style.display="block";$("points").textContent=score*5;$("streak").textContent=streak;$("next").style.display="block"}
function nextQ(){idx++;idx>=15?finish():render()}function finish(){$("game").classList.add("hidden");$("end").classList.remove("hidden");let p=Math.round(score/15*100);$("final").textContent=`${score}/15 · ${p}%`;$("message").textContent=p>=87?"Excellent! Holiday vocabulary mastered!":p>=60?"Good work! Play again to improve your score.":"Keep practising and try the mission again."}</script></body></html>
